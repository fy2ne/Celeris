name: Celeris
version: '0.1.0-beta'
main: dev.fy2ne.celeris.bootstrap.PaperBootstrap
api-version: '1.20'
folia-supported: true
description: Rust native TCP pacer and priority packet engine
authors: [fy2ne]
commands:
  celeris:
    description: Celeris live network diagnostics and tuning
    usage: /celeris [stats | bench [kb] [iters] | debug | test | toggle | ping | lowat <bytes> | level <0-9> | bulk <bytes|0>]
    permission: celeris.admin
permissions:
  celeris.admin:
    default: op

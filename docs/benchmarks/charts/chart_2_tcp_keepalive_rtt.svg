  <text x="188.7" y="294.1" text-anchor="middle" font-size="10.5" class="mono">1.57</text>
  <rect x="221.7" y="308.3" width="42" height="17.7" rx="4" fill="#a98fff" fill-opacity="0.88"/>
  <text x="242.7" y="302.3" text-anchor="middle" font-size="10.5" class="mono">1.07</text>
  <text x="438.0" y="360" text-anchor="middle" font-size="12" font-weight="500">512 KB Burst</text>
  <rect x="363.0" y="124.4" width="42" height="201.6" rx="4" fill="#f07a6a" fill-opacity="0.88"/>

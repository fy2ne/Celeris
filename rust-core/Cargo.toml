[package]
name = "celeris-core"
version = "0.1.0-beta"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "celeris_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
flate2 = "1.0"
aes = "0.8"
cfb8 = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }

name: Issue Claim & 7-Day Expiry

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 6 * * *'

permissions:
  issues: write

jobs:
  claim-command:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request && (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const sender = context.payload.comment.user.login;
            const body = context.payload.comment.body.trim();
            const issue = context.payload.issue;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            if (body.startsWith('/claim')) {
              const assignees = issue.assignees || [];
              if (assignees.length > 0 && !assignees.some(a => a.login === sender)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `@${sender} this issue is already claimed by @${assignees[0].login}. Wait for \`/unclaim\` or 7-day expiry.`
                });
                return;
              }
              await ensureLabel('claimed', 'a98fff', 'Claimed by a contributor (7-day lease)');
              await github.rest.issues.addAssignees({ owner, repo, issue_number: issueNumber, assignees: [sender] });
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['claimed'] });
              const until = new Date(Date.now() + 7 * 86400_000).toISOString().slice(0, 10);
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `Claimed by @${sender} until **${until}** (7 days). Link your PR with \`Closes #${issueNumber}\` or run \`/unclaim\` to release early.`
              });
              return;
            }

            if (body.startsWith('/unclaim')) {
              const assignees = issue.assignees || [];
              const isOwner = sender === owner;
              if (!isOwner && !assignees.some(a => a.login === sender)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `@${sender} only the current assignee can run \`/unclaim\`.`
                });
                return;
              }
              if (assignees.length > 0) {
                await github.rest.issues.removeAssignees({
                  owner, repo, issue_number: issueNumber,
                  assignees: assignees.map(a => a.login)
                });
              }
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'claimed' });
              } catch {}
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `Released by @${sender}. Issue is open for \`/claim\`.`
              });
            }

  expire-claims:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - 7 * 86400_000;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'claimed', per_page: 50
            });
            for (const issue of issues) {
              if (issue.pull_request || !issue.assignees?.length) continue;
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              const lastAssign = [...events].reverse().find(e => e.event === 'assigned');
              const assignedAt = lastAssign ? Date.parse(lastAssign.created_at) : Date.parse(issue.updated_at);
              if (assignedAt > cutoff) continue;
              const hasOpenPr = events.some(e => e.event === 'cross-referenced' && e.source?.issue?.pull_request && e.source.issue.state === 'open');
              if (hasOpenPr) continue;
              await github.rest.issues.removeAssignees({
                owner, repo, issue_number: issue.number,
                assignees: issue.assignees.map(a => a.login)
              });
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'claimed' });
              } catch {}
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `7-day claim expired with no open linked PR. Issue unassigned and open for \`/claim\`.`
              });
            }

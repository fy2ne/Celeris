name: PR Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map(l => l.name);
            const allowLarge = labels.includes('allow-large-pr');
            const skipIssue = labels.includes('no-issue') || pr.user.login === owner;

            const body = pr.body || '';
            const hasLinkedIssue = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+#\d+/i.test(body);
            if (!skipIssue && !hasLinkedIssue) {
              core.setFailed('PR must link an issue (e.g. "Closes #12") unless labeled "no-issue".');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            let codeAdditions = 0;
            for (const f of files) {
              if (f.filename === 'Cargo.lock' || f.filename.startsWith('docs/benchmarks/data/')) continue;
              codeAdditions += f.additions;
            }

            if (!allowLarge && codeAdditions > 500) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `PR adds **${codeAdditions}** lines (limit is **500** added lines). Split into smaller focused PRs or request the \`allow-large-pr\` label.`
              });
              core.setFailed(`PR exceeds max 500 added lines (${codeAdditions} > 500).`);
            }
